[project]
name = "spark-fuse-comfyui-node"
version = "0.2.2"
description = "Click the ⚡ button to render your open ComfyUI workflow on a Spark Fuse cloud GPU and pull the result back into your graph. No CLI, no file export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "spark-fuse-messenger>=0.5.0",
]

[project.urls]
Repository = "https://github.com/VFXGuru/spark-fuse-comfyui-node"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.comfy]
PublisherId = "vfxguru"
DisplayName = "Spark Fuse Cloud GPU Bridge"
Repository = "https://github.com/VFXGuru/spark-fuse-comfyui-node"
